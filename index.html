
<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #F4E9D5;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #315C49;
}

h1 {
  margin-top: 30px;
  font-size: 32px;
}

p {
  font-size: 20px;
}

model-viewer {
  width: 100%;
  height: 75vh;
  background: #F4E9D5;
}

</style>
</head>

<body>

<h1>Explore o carrinho em 360°</h1>

<p>Arraste para girar e descobrir todos os detalhes.</p>

<model-viewer
id="carro"
camera-controls
auto-rotate
auto-rotate-delay="0"
rotation-per-second="20deg"
shadow-intensity="1"
exposure="1"
environment-image="neutral"
alt="Carrinho 3D representando uma região do Brasil">
</model-viewer>

<script>

const modelos = {

  norte: "Meshy_AI_Tropical_Trailblazer_1113005618_texture.glb",

  centro: "centro oeste 3d.glb",

  nordeste: "nordeste 3d.glb",

  sudeste: "sudeste 3d.glb",

  sul: "sul 3d.glb"

};

const parametros = new URLSearchParams(window.location.search);

const regiao = parametros.get("carro") || "norte";

const viewer = document.getElementById("carro");

viewer.src = modelos[regiao] || modelos.norte;

</script>

</body>
</html>
