
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
body {
  margin: 0;
  background: #f4e9d3;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #285640;
}

h1 {
  margin-top: 30px;
  font-size: 30px;
}

p {
  font-size: 18px;
}

model-viewer {
  width: 100%;
  height: 75vh;
  background: transparent;
  --poster-color: transparent;
}
</style>
</head>

<body>

<h1>Explore o carrinho em 360°</h1>
<p>Arraste para girar e descobrir todos os detalhes.</p>

<model-viewer
src="https://github.com/melcatelli2016-coder/carronorte/releases/download/v1.0/Meshy_AI_Tropical_Trailblazer_1113005618_texture.glb"
camera-controls
auto-rotate
auto-rotate-delay="1000"
rotation-per-second="15deg"
camera-orbit="0deg 75deg auto"
field-of-view="30deg"
min-camera-orbit="auto auto 1m"
max-camera-orbit="auto auto 20m"
shadow-intensity="1"
exposure="1"
interaction-prompt="auto"
loading="eager"
>
</model-viewer>

</body>
</html>
